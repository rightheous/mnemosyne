name: Pumice
options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  PumiceCore:
    path: Packages/PumiceCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    TARGETED_DEVICE_FAMILY: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "5"

targets:
  Pumice:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      - path: Sources
    resources:
      - path: App/Assets.xcassets
        optional: true
    dependencies:
      - package: PumiceCore
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_NAME: Mnemosyne
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        # The Generation flag's nested-key auto-mapping (UIImageName etc.)
        # doesn't fire correctly in Xcode 26 — it produces a malformed
        # UILaunchScreen { UILaunchScreen {} } and the image never shows.
        # Use a real launch storyboard instead, which is the canonical
        # way Apple documents and the only path with predictable
        # behavior across Xcode versions.
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleDisplayName: 므네모시네
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PumiceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/PumiceTests
    dependencies:
      - target: Pumice
      - package: PumiceCore
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pumice.app/Pumice"

  PumiceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/PumiceUITests
    resources:
      - path: MnemosyneContracts/fixtures/study-session.json
    dependencies:
      - target: Pumice
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pumice
        # The vendored fastlane SnapshotHelper.swift predates Swift 6 strict
        # concurrency. Relax the checking on this target so we don't have to
        # patch upstream code.
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  Pumice:
    build:
      targets:
        Pumice: all
        PumiceTests: [test]
    test:
      targets:
        - PumiceTests
      gatherCoverageData: true
      coverageTargets:
        - Pumice
    run:
      config: Debug
    archive:
      config: Release

  PumiceUITests:
    build:
      targets:
        Pumice: all
        PumiceUITests: [test]
    test:
      targets:
        - PumiceUITests
    run:
      config: Debug
