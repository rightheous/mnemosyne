# Mnemosyne single-user Docker Compose profile for Windows + WSL2.
# Run these commands from upstreams/DeepTutor:
#   docker compose -f compose.yaml config --quiet
#   docker compose -f compose.yaml build
#   docker compose -f compose.yaml up -d
#
# Bind to loopback by default. To use a private LAN, set
# DEEPTUTOR_BIND_ADDRESS to the WSL2 host-reachable address and restrict both
# published ports in Windows Firewall. Do not expose this profile to the
# public Internet. Keep provider credentials in the app's private settings
# volume; never put them in this file or in a Compose environment variable.
#
# The backend and web frontend share the upstream production image because
# that is the pinned upstream packaging boundary. Redis is private to the
# Compose network and persists native turn coordination state. PocketBase and
# the sandbox runner are omitted: they are optional upstream services and are
# not needed by the single-user SQLite profile.

name: mnemosyne

services:
  redis:
    image: docker.io/library/redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ./data/redis:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s

  deeptutor:
    image: mnemosyne/deeptutor:local
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /run:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
      - /var/log:size=64m,mode=0755
      - /root:size=16m,mode=0700
      - /home:size=16m,mode=0755
    ports:
      - "${DEEPTUTOR_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT_BACKEND:-8001}:8001"
      - "${DEEPTUTOR_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT_FRONTEND:-3782}:3782"
    volumes:
      # The application, SQLite state, uploaded originals, parser outputs,
      # settings and workspace stay in one host-side tree for backup/restore.
      - ./data:/app/data
      - ./data/user/workspace:/workspace
    environment:
      TZ: ${TZ:-UTC}
      DEEPTUTOR_WORKSPACE_ROOT: /workspace
      DEEPTUTOR_WORKSPACE_ALLOWED_ROOTS: /workspace
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - private
    stop_grace_period: 45s

networks:
  private:
    driver: bridge
